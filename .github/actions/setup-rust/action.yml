name: Setup Rust
description: Rust toolchain, cargo cache and private-dependency credentials for one workspace.

inputs:
  workspace:
    description: Workspace directory, relative to the repository root.
    required: true
  app-id:
    description: biometric-engines GitHub App client id.
    required: false
    default: ""
  private-key:
    description: biometric-engines GitHub App private key.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Only deepface/enclave resolves a private repository; the other workspaces need no token.
    - id: token
      if: inputs.workspace == 'deepface/enclave'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: worldcoin
        repositories: biometric-engines

    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
      with:
        toolchain: 1.97.0
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspace }}

    - if: steps.token.outputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ steps.token.outputs.token }}
      run: |
        git config --global \
          url."https://x-access-token:${TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
          "https://github.com/worldcoin/biometric-engines"
