name: test EIF reproducibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.workload }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        workload: [deepface, di]
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines

      - env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Fetch face models
        if: matrix.workload == 'deepface'
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: |
          models=$(nix eval --json --no-update-lock-file .#faceModels)
          for file in $(jq -r 'keys[]' <<<"$models"); do
            path=$(jq -r --arg f "$file" '.[$f].storePath' <<<"$models")
            nix path-info "$path" >/dev/null 2>&1 && continue
            url=$(jq -r --arg f "$file" '.[$f].url' <<<"$models")
            hash=$(jq -r --arg f "$file" '.[$f].hash' <<<"$models")
            printf 'header = "Authorization: Bearer %s"\n' "$HUGGING_FACE_TOKEN" \
              | curl --proto '=https' --tlsv1.2 -sSfL --config - -o "/tmp/$file" "$url"
            test "$(nix hash file --type sha256 --base16 "/tmp/$file")" = "$hash"
            test "$(nix-store --add-fixed sha256 "/tmp/$file")" = "$path"
          done

      - name: Build EIF
        env:
          GH_APP_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          out=$(nix build -L --no-link --no-update-lock-file --print-out-paths ".#${{ matrix.workload }}-eif")
          cp "$out/image.eif" image.eif
          cp "$out/pcr.json" pcr.json
          sha256sum image.eif > sha256.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.workload }}-${{ matrix.runner }}
          path: |
            image.eif
            pcr.json
            sha256.txt
          if-no-files-found: error
          retention-days: 1

  compare:
    name: compare ${{ matrix.workload }} builds
    needs: build
    strategy:
      matrix:
        workload: [deepface, di]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ matrix.workload }}-*
          path: builds

      - name: Compare outputs
        run: |
          cmp "builds/${{ matrix.workload }}-ubuntu-22.04/image.eif" \
              "builds/${{ matrix.workload }}-ubuntu-24.04/image.eif"
          diff -u \
            <(jq -S . "builds/${{ matrix.workload }}-ubuntu-22.04/pcr.json") \
            <(jq -S . "builds/${{ matrix.workload }}-ubuntu-24.04/pcr.json")
          cat builds/${{ matrix.workload }}-*/sha256.txt
