name: Release Crates

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Release-plz must observe every main-branch commit in order. Never cancel a queued or
# in-progress release: doing so can skip a version between two merges.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-crates:
    name: Release Crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.0

      # With no CARGO_REGISTRY_TOKEN present, release-plz exchanges this job's OIDC token
      # for a short-lived crates.io credential using each crate's trusted-publisher entry.
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
