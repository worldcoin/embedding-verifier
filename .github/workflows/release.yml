# Cuts a versioned release of one workload: its enclave EIF, its measurements, its host
# image, and the carrier image that ships the EIF into Kubernetes.
#
# Tags are per workload (`deepface/v*`, `di/v*`) because the enclave crate's package.version
# is measured into PCR0 — flake.nix reads it from <workload>/enclave/Cargo.toml. A repo-wide
# tag would rotate both enclaves' measurements for a change to one of them, and every client
# pinning the untouched workload would have to re-register for nothing.
#
# Nothing is published until two independent builds of the same commit measure to the same
# PCRs. A PCR only means something if anyone holding this commit can re-derive it; flake.nix
# makes that true by construction, and `verify-reproducible` is what proves the construction
# still holds for this release. The failure it catches is quiet: an input the flake's fileset
# does not capture makes the build depend on something outside the pinned closure, and the
# published PCR then describes a rootfs nobody else can reproduce.
name: release

on:
  push:
    tags:
      - "deepface/v*"
      - "di/v*"
  workflow_dispatch:
    inputs:
      workload:
        description: "Which enclave to release."
        required: true
        type: choice
        options: [deepface, di]
      ref:
        description: "Branch, tag, or commit SHA to build."
        required: true
        type: string
      dry_run:
        description: "Build and verify, publish nothing."
        required: false
        default: true
        type: boolean

# Two cold ~90-minute Nix builds per run. Never cancel one in flight: a half-published
# release is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  prepare-release:
    name: prepare release
    runs-on: ubuntu-latest
    outputs:
      WORKLOAD: ${{ steps.release.outputs.WORKLOAD }}
      VERSION: ${{ steps.release.outputs.VERSION }}
      TAG: ${{ steps.release.outputs.TAG }}
      SHA: ${{ steps.release.outputs.SHA }}
      SHORT_SHA: ${{ steps.release.outputs.SHORT_SHA }}
      PUBLISH: ${{ steps.release.outputs.PUBLISH }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          INPUT_WORKLOAD: ${{ inputs.workload }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
            workload="${tag%%/*}"
            version="${tag#*/v}"
            publish=true
          else
            workload="$INPUT_WORKLOAD"
            version=""      # taken from the manifest below
            tag=""
            if [[ "$DRY_RUN" == "true" ]]; then publish=false; else publish=true; fi
          fi

          manifest="$workload/enclave/Cargo.toml"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::No enclave manifest at $manifest — '$workload' is not a workload." >&2
            exit 1
          fi

          # flake.nix reads `.package.version` from this manifest into the EIF, so the field is
          # measured. A tag naming a version the enclave does not carry describes a build nobody
          # can reproduce from the tag alone. Read it with tomllib rather than a regex, which
          # would happily match a dependency's version line instead.
          manifest_version=$(python3 -c \
            'import sys,tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' \
            "$manifest")
          if [[ -z "$version" ]]; then
            version="$manifest_version"
            tag="$workload/v$version"
          elif [[ "$version" != "$manifest_version" ]]; then
            echo "::error::Tag $tag names version $version, but $manifest says $manifest_version." >&2
            echo "::error::That field is measured into PCR0. Bump it and re-measure before tagging." >&2
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $version (expected X.Y.Z with an optional pre-release)." >&2
            exit 1
          fi

          if [[ "$publish" == "true" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Publishing again would replace a" >&2
            echo "::error::measurement clients may already have registered." >&2
            exit 1
          fi

          release_sha=$(git rev-parse HEAD)
          {
            echo "WORKLOAD=$workload"
            echo "VERSION=$version"
            echo "TAG=$tag"
            echo "SHA=$release_sha"
            echo "SHORT_SHA=${release_sha::7}"
            echo "PUBLISH=$publish"
          } >> "$GITHUB_OUTPUT"

  # Two independent builds of the same commit. Neither can shortcut to the other's result:
  # the enclave derivation is in no binary cache, so each substitutes the pinned nixpkgs
  # closure and compiles the crate from source. Only `canonical` produces artifacts anything
  # downstream publishes; `reproduction` exists solely to be diffed against it.
  build-enclave:
    name: build enclave (${{ matrix.attempt }} on ${{ matrix.runner }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - attempt: canonical
            runner: ubuntu-latest
          - attempt: reproduction
            runner: ubuntu-22.04
    env:
      WORKLOAD: ${{ needs.prepare-release.outputs.WORKLOAD }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}

      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines

      # crane resolves the private face-engine dependency with `builtins.fetchGit`, which runs
      # on the host and uses the host's git credentials. A credential helper rather than
      # `url.insteadOf`, because the rewrite depends on which git backend Nix was built with.
      - name: Authorize git for biometric-engines
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Build EIF and measure
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: scripts/build-eif.sh --workload "$WORKLOAD" target/eif

      - name: Record layer hashes
        run: |
          scripts/closure-hashes.sh "$WORKLOAD" \
            "target/eif/closure-$WORKLOAD.txt" \
            "target/eif/$WORKLOAD-enclave.eif"

      # Build-side fingerprints rather than measurements, so they stay out of the shape the
      # repo commits.
      #
      # `ociStoreHash` is the boundary Nix guarantees; `eifSha256` is what came out of AWS
      # nitro-cli's conversion, which Nix does not pin. Recording both separately is what
      # lets a mismatch say which half moved — the same OCI hash with a different EIF hash
      # means the conversion is not deterministic, not that the source changed.
      - name: Record build provenance
        run: |
          set -euo pipefail
          oci_store=$(nix build --no-link --no-update-lock-file --print-out-paths ".#${WORKLOAD}-oci")
          jq -n \
            --arg eifSha256 "$(sha256sum "target/eif/$WORKLOAD-enclave.eif" | cut -d' ' -f1)" \
            --arg ociStoreHash "$(nix hash path --type sha256 --sri "$oci_store")" \
            --arg rustToolchain "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" \
            '{eifSha256: $eifSha256, ociStoreHash: $ociStoreHash, rustToolchain: $rustToolchain}' \
            > target/eif/provenance.json
          jq . target/eif/provenance.json

      # Recorded, never compared. Nix pins the OCI image and nitro-cli, but the Docker daemon
      # that linuxkit reads the image back through is the host's, and the EIF is assembled on
      # the far side of it. Two runner images therefore disagree here by design — and the
      # PCRs still matching across them is the evidence that the daemon does not influence
      # the measurement.
      - name: Record build environment
        run: |
          set -euo pipefail
          jq -n \
            --arg runnerOs "${RUNNER_OS}" \
            --arg runnerImage "${ImageOS:-unknown}" \
            --arg kernel "$(uname -sr)" \
            --arg docker "$(docker version --format '{{.Server.Version}}' 2>/dev/null || echo unavailable)" \
            --arg nitroCli "$(nix build --no-link --no-update-lock-file --print-out-paths .#nitro-cli)" \
            '{runnerOs: $runnerOs, runnerImage: $runnerImage, kernel: $kernel,
              dockerServer: $docker, nitroCliStore: $nitroCli}' \
            > target/eif/environment.json
          jq . target/eif/environment.json

      # Which model bytes the enclave measured. A PCR does not say, and the models are the
      # part of the closure that moves without a code change.
      - name: Record face model sources
        if: env.WORKLOAD == 'deepface'
        run: |
          set -euo pipefail
          nix eval --json --no-update-lock-file .#faceModels \
            | jq 'map_values({url, hash})' > target/eif/face-models.json
          jq . target/eif/face-models.json

      # The EIF is hundreds of megabytes and only the canonical build's copy is ever
      # published; the reproduction leg only needs to be diffable.
      - name: Upload EIF
        if: matrix.attempt == 'canonical'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eif-canonical
          path: target/eif/${{ needs.prepare-release.outputs.WORKLOAD }}-enclave.eif
          if-no-files-found: error
          retention-days: 7

      - name: Upload measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: measurements-${{ matrix.attempt }}
          path: |
            target/eif/measurements.json
            target/eif/provenance.json
            target/eif/environment.json
            target/eif/face-models.json
            target/eif/${{ needs.prepare-release.outputs.WORKLOAD }}-pcr.json
            target/eif/closure-${{ needs.prepare-release.outputs.WORKLOAD }}.txt
          if-no-files-found: error

  verify-reproducible:
    name: verify reproducible
    needs: [prepare-release, build-enclave]
    runs-on: ubuntu-latest
    outputs:
      PCR0: ${{ steps.compare.outputs.PCR0 }}
      PCR1: ${{ steps.compare.outputs.PCR1 }}
      PCR2: ${{ steps.compare.outputs.PCR2 }}
      EIF_SHA256: ${{ steps.compare.outputs.EIF_SHA256 }}
    env:
      WORKLOAD: ${{ needs.prepare-release.outputs.WORKLOAD }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}

      - name: Download measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: measurements-*

      - name: Compare builds
        id: compare
        run: |
          set -euo pipefail
          canonical=measurements-canonical
          reproduction=measurements-reproduction

          if ! diff -u <(jq -S --arg w "$WORKLOAD" '.[$w]' "$reproduction/measurements.json") \
                       <(jq -S --arg w "$WORKLOAD" '.[$w]' "$canonical/measurements.json"); then
            echo "::error::Two builds of $GITHUB_SHA measured to different PCRs."
            echo "::error::Most likely an input flake.nix's \`cargoFiles\` fileset does not capture"
            echo "::error::(a newly embedded asset, a generated file), making the build depend on"
            echo "::error::something outside the pinned closure. The layer diff below names it."
            diff -u "$reproduction/closure-$WORKLOAD.txt" "$canonical/closure-$WORKLOAD.txt" || true
            exit 1
          fi

          if ! diff -u <(jq -S . "$reproduction/provenance.json") \
                       <(jq -S . "$canonical/provenance.json"); then
            if [ "$(jq -r .ociStoreHash "$reproduction/provenance.json")" \
               = "$(jq -r .ociStoreHash "$canonical/provenance.json")" ]; then
              echo "::error::Nix produced the same OCI image twice and nitro-cli converted it"
              echo "::error::into two different EIFs, so the conversion depends on the host."
              echo "::error::The two build environments were:"
              jq -c . "$canonical/environment.json" "$reproduction/environment.json"
              echo "::error::A PCR from this build cannot be re-derived on another machine."
            else
              echo "::error::Two builds of the same commit produced different OCI images,"
              echo "::error::so the divergence is in what Nix built, not in the conversion."
            fi
            exit 1
          fi

          # The layer hashes are how a future drift gets diagnosed, so they have to agree now.
          if ! diff -u "$reproduction/closure-$WORKLOAD.txt" "$canonical/closure-$WORKLOAD.txt"; then
            echo "::error::Identical PCRs from different closures. Something in the measured"
            echo "::error::graph is not deterministic; the matching PCRs are luck, not proof."
            exit 1
          fi

          # The committed measurements are this commit's claim about itself. Releasing a
          # different number means the tree says one thing and the deployment pins another.
          if ! diff -u <(jq -S --arg w "$WORKLOAD" '.[$w]' measurements.json) \
                       <(jq -S --arg w "$WORKLOAD" '.[$w]' "$canonical/measurements.json"); then
            echo "::error::Built PCRs do not match measurements.json."
            echo "::error::Re-measure with scripts/build-eif.sh and commit the result before tagging."
            exit 1
          fi

          jq -r --arg w "$WORKLOAD" \
            '"PCR0=\(.[$w].pcr0)", "PCR1=\(.[$w].pcr1)", "PCR2=\(.[$w].pcr2)"' \
            "$canonical/measurements.json" >> "$GITHUB_OUTPUT"
          jq -r '"EIF_SHA256=\(.eifSha256)"' "$canonical/provenance.json" >> "$GITHUB_OUTPUT"

          # What the match is worth depends on how different the two builds were, so say so.
          {
            echo "## Reproduced across two environments"
            echo ""
            echo "| | canonical | reproduction |"
            echo "|---|---|---|"
            for f in runnerImage kernel dockerServer; do
              printf '| %s | `%s` | `%s` |\n' "$f" \
                "$(jq -r --arg f "$f" '.[$f]' "$canonical/environment.json")" \
                "$(jq -r --arg f "$f" '.[$f]' "$reproduction/environment.json")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Asked only once, and only once the build is known releasable. A gate in front of the
  # builds would ask a human to approve an hour before anything is known about the result.
  approve-publish:
    name: approve publish
    needs: [prepare-release, verify-reproducible]
    if: needs.prepare-release.outputs.PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: true

  # The host image for this workload, built at the same commit the measurements describe.
  # Not behind the gate: GHCR host images are published on every push to main already, so
  # this is not the artifact the approval exists to govern.
  build-host-image:
    name: build host image
    needs: [prepare-release, verify-reproducible]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: ${{ needs.prepare-release.outputs.SHA }}
      version: v${{ needs.prepare-release.outputs.VERSION }}
      workload: ${{ needs.prepare-release.outputs.WORKLOAD }}
      push: ${{ needs.prepare-release.outputs.PUBLISH == 'true' }}

  # Carrier image so Kubernetes can run the EIF from an init container (the AWS Nitro Enclaves
  # device plugin pattern). Built from the verified canonical EIF, after the gate — a carrier
  # pushed before reproduction agrees is a measurement nobody has checked.
  build-carrier:
    name: build carrier image
    needs: [prepare-release, verify-reproducible, approve-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    outputs:
      DIGEST: ${{ steps.push.outputs.digest }}
      IMAGE: ${{ steps.image.outputs.name }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}

      - name: Download EIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eif-canonical
          path: target/eif

      - name: Resolve image name
        id: image
        env:
          WORKLOAD: ${{ needs.prepare-release.outputs.WORKLOAD }}
        run: echo "name=$REGISTRY/$OWNER/embedding-verifier-$WORKLOAD-enclave-eif" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Context is target/eif, so EIF_FILE is a bare filename. Nitro Enclaves are x86_64 only,
      # so there is no manifest to merge.
      - name: Build and push carrier
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: target/eif
          file: scripts/Dockerfile.carrier
          build-args: EIF_FILE=${{ needs.prepare-release.outputs.WORKLOAD }}-enclave.eif
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:v${{ needs.prepare-release.outputs.VERSION }}
            ${{ steps.image.outputs.name }}:sha-${{ needs.prepare-release.outputs.SHORT_SHA }}

      - name: Attest carrier provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: true
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}

  draft-release:
    name: draft release
    needs: [prepare-release, verify-reproducible, approve-publish, build-host-image, build-carrier]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      WORKLOAD: ${{ needs.prepare-release.outputs.WORKLOAD }}
      VERSION: ${{ needs.prepare-release.outputs.VERSION }}
      TAG: ${{ needs.prepare-release.outputs.TAG }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.SHA }}
      PCR0: ${{ needs.verify-reproducible.outputs.PCR0 }}
      PCR1: ${{ needs.verify-reproducible.outputs.PCR1 }}
      PCR2: ${{ needs.verify-reproducible.outputs.PCR2 }}
    steps:
      - name: Check Out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare-release.outputs.SHA }}
          fetch-depth: 0

      - name: Download measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: measurements-canonical
          path: assets

      - name: Download EIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eif-canonical
          path: assets

      # The manifest is what a third party checks a rebuild against, and what the deploy reads
      # PCR0 out of: the commit, the pinned flake inputs it resolves to, the measurements
      # verbatim, and the images carrying them. `measurements` is the same object the repo
      # commits, so a rebuild diffs against it directly.
      - name: Build manifest
        env:
          HOST_IMAGE: ${{ needs.build-host-image.outputs.image }}
          HOST_DIGEST: ${{ needs.build-host-image.outputs.digest }}
          CARRIER_IMAGE: ${{ needs.build-carrier.outputs.IMAGE }}
          CARRIER_DIGEST: ${{ needs.build-carrier.outputs.DIGEST }}
        run: |
          set -euo pipefail
          face_models='{}'
          if [[ -f assets/face-models.json ]]; then
            face_models=$(cat assets/face-models.json)
          fi
          # Only this workload's entry: the committed file also carries the other enclave's
          # PCRs, which this release neither built nor verified.
          jq --arg w "$WORKLOAD" '.[$w]' assets/measurements.json > workload-measurements.json
          jq -n \
            --arg workload "$WORKLOAD" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg gitSha "$RELEASE_SHA" \
            --arg flakeLockSha256 "$(sha256sum flake.lock | cut -d' ' -f1)" \
            --arg hostImage "$HOST_IMAGE@$HOST_DIGEST" \
            --arg carrierImage "$CARRIER_IMAGE@$CARRIER_DIGEST" \
            --argjson flakeInputs "$(jq '.nodes | del(.root) | map_values(.locked)' flake.lock)" \
            --argjson faceModels "$face_models" \
            --slurpfile measurements workload-measurements.json \
            --slurpfile provenance assets/provenance.json \
            '{workload: $workload, version: $version, tag: $tag, gitSha: $gitSha,
              flake: {lockSha256: $flakeLockSha256, inputs: $flakeInputs},
              measurements: $measurements[0],
              provenance: $provenance[0],
              faceModels: $faceModels,
              images: {host: $hostImage, eifCarrier: $carrierImage}}' \
            > assets/manifest.json
          jq . assets/manifest.json

          # Cross-check rather than trust the job outputs: an empty digest interpolates to a
          # bare "image@" that reads like a pinned reference and resolves to nothing.
          for ref in "$HOST_IMAGE@$HOST_DIGEST" "$CARRIER_IMAGE@$CARRIER_DIGEST"; do
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::Unpinned image: $ref"; exit 1; }
          done
          [[ "$PCR0" =~ ^0x[0-9a-f]{96}$ ]] || { echo "::error::Bad PCR0: $PCR0"; exit 1; }

      - name: Checksum assets
        working-directory: assets
        run: |
          set -euo pipefail
          rm -f measurements.json     # the repo-wide file; manifest.json carries this workload's
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      # One attestation covering every asset, keyed by the checksum file. Verify any of them
      # with `gh attestation verify <file> --repo <this repo>`.
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          set -euo pipefail
          previous=$(git describe --tags --match "$WORKLOAD/v*" --abbrev=0 "${RELEASE_SHA}^" 2>/dev/null || true)
          {
            echo "CHANGELOG<<ENDCHANGELOG"
            git log --pretty=format:"- %s" "${previous:+$previous..}$RELEASE_SHA" -- \
              "$WORKLOAD/" shared/ flake.nix flake.lock rust-toolchain.toml \
              scripts/build-eif.sh scripts/Dockerfile.carrier
            echo
            echo "ENDCHANGELOG"
          } >> "$GITHUB_OUTPUT"

      # The changelog reaches the heredoc as a variable, not as interpolated text: commit
      # subjects routinely contain backticks, and the heredoc has to stay unquoted for the
      # PCRs to expand. A variable's value is not re-scanned for command substitution.
      - name: Create release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
          HOST_IMAGE: ${{ needs.build-host-image.outputs.image }}
          CARRIER_IMAGE: ${{ needs.build-carrier.outputs.IMAGE }}
        run: |
          set -euo pipefail
          body=$(cat <<- ENDBODY
          ## Measurements

          Reproduced by two independent builds of \`$RELEASE_SHA\` before this release was cut.

          | PCR | Value |
          |-----|-------|
          | PCR0 | \`$PCR0\` |
          | PCR1 | \`$PCR1\` |
          | PCR2 | \`$PCR2\` |

          PCR0 is what a host and a client pin. Register it with every client **before** this
          enclave serves traffic, and keep the previous measurement in the allow-list until
          clients have adopted the new one.

          ## Images

          - \`$HOST_IMAGE:v$VERSION\` — the host
          - \`$CARRIER_IMAGE:v$VERSION\` — EIF carrier for the enclave sidecar

          Pinned digests are in \`manifest.json\`.

          ## Verify

          \`\`\`
          gh release download $TAG -R $GITHUB_REPOSITORY
          gh attestation verify manifest.json --repo $GITHUB_REPOSITORY \\
             --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml
          sha256sum -c SHA256SUMS
          \`\`\`

          Reproduce the measurements from source (x86_64-linux with Nix):

          \`\`\`
          git checkout $RELEASE_SHA
          scripts/build-eif.sh --workload $WORKLOAD target/eif
          diff <(jq -S '.$WORKLOAD' measurements.json) \\
               <(jq -S '.$WORKLOAD' target/eif/measurements.json)
          \`\`\`

          ## Changes

          $CHANGELOG
          ENDBODY
          )
          printf '%s\n' "$body" \
            | gh release create --draft --target "$RELEASE_SHA" \
                -t "$TAG" -F - "$TAG" assets/*

  summary:
    name: release summary
    if: always()
    needs: [prepare-release, build-enclave, verify-reproducible, build-host-image, build-carrier, draft-release]
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          TAG: ${{ needs.prepare-release.outputs.TAG }}
          PUBLISH: ${{ needs.prepare-release.outputs.PUBLISH }}
          BUILD_RESULT: ${{ needs.build-enclave.result }}
          REPRO_RESULT: ${{ needs.verify-reproducible.result }}
          HOST_RESULT: ${{ needs.build-host-image.result }}
          CARRIER_RESULT: ${{ needs.build-carrier.result }}
          RELEASE_RESULT: ${{ needs.draft-release.result }}
          PCR0: ${{ needs.verify-reproducible.outputs.PCR0 }}
          PCR1: ${{ needs.verify-reproducible.outputs.PCR1 }}
          PCR2: ${{ needs.verify-reproducible.outputs.PCR2 }}
        run: |
          status() { [ "$1" = "success" ] && echo "✅" || echo "❌ ($1)"; }
          {
            echo "## 📦 ${TAG:-unresolved}"
            [ "$PUBLISH" = "true" ] || echo ""
            [ "$PUBLISH" = "true" ] || echo "Dry run — nothing was published."
            echo ""
            echo "| Step | Status |"
            echo "|------|--------|"
            echo "| Enclave builds | $(status "$BUILD_RESULT") |"
            echo "| Reproducibility gate | $(status "$REPRO_RESULT") |"
            echo "| Host image | $(status "$HOST_RESULT") |"
            echo "| Carrier image | $(status "$CARRIER_RESULT") |"
            echo "| Draft release | $(status "$RELEASE_RESULT") |"
            if [ -n "${PCR0:-}" ]; then
              echo ""
              echo "| PCR | Value |"
              echo "|-----|-------|"
              echo "| PCR0 | \`$PCR0\` |"
              echo "| PCR1 | \`$PCR1\` |"
              echo "| PCR2 | \`$PCR2\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
