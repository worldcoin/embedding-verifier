name: Carrier contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carrier-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: |
          eif_file=$(sed -n 's/^ARG EIF_FILE=//p' scripts/Dockerfile.carrier)
          test "$eif_file" = verifier-enclave.eif
