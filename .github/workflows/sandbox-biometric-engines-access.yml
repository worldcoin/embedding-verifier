# Sandbox / temporary: verifies the biometric-engines GitHub App (INFRA-7034) can
# actually read worldcoin/biometric-engines from this public repo's Actions runs,
# before wiring the token into the real cargo build steps. Delete once confirmed.
#
# Triggered on pull_request (scoped to this file) instead of workflow_dispatch:
# workflow_dispatch only runs workflow files that exist on the default branch,
# and this is intentionally not being merged to main.
name: Sandbox - biometric-engines App access test

on:
  pull_request:
    paths:
      - ".github/workflows/sandbox-biometric-engines-access.yml"

permissions:
  contents: read

jobs:
  test-access:
    name: Test GitHub App access to biometric-engines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines

      - name: Verify git read access
        run: |
          git ls-remote "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/worldcoin/biometric-engines" refs/tags/face-engine-v2.16.0

      - name: Verify API read access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/worldcoin/biometric-engines --jq '{full_name, private}'

  test-cargo-fetch:
    name: Test cargo fetch of face-engine via App token
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines

      - name: Configure git to use the App token for biometric-engines
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/worldcoin/biometric-engines".insteadOf "https://github.com/worldcoin/biometric-engines"

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Create throwaway crate depending on face-engine
        run: |
          cargo init --lib --quiet /tmp/face-engine-fetch-test
          cat >> /tmp/face-engine-fetch-test/Cargo.toml <<'EOF'
          face-engine = { git = "https://github.com/worldcoin/biometric-engines", rev = "face-engine-v2.16.0", default-features = false, features = ["tract"] }
          EOF

      - name: cargo fetch (real dependency-resolution path used by CI builds)
        working-directory: /tmp/face-engine-fetch-test
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: cargo fetch --verbose
