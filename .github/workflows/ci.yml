# Three independent cargo workspaces, each with its own lockfile: the host-side one at the
# repository root, and one per enclave so nothing outside an EIF's own graph can move its PCRs.
# Every job runs across all three. Only deepface/enclave reaches a private repository, so the
# other two lanes run without a token — if the root workspace ever regains `face-engine`, its
# lane fails here rather than in a Docker build.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path ${{ matrix.workspace }}/Cargo.toml --all -- --check

  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run Clippy
        run: cargo clippy --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --all-targets --all-features --

  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Build debug
        run: cargo build --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --verbose
      - name: Build release
        run: cargo build --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --release --verbose

  test:
    name: Test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run tests
        run: cargo test --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --all --all-features --verbose

  deny:
    name: Cargo deny (${{ matrix.workspace }}, ${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        with:
          command: check ${{ matrix.checks }}
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          rust-version: 1.97.0
          # Only the deepface enclave lane mints a token; the others resolve nothing private.
          credentials: ${{ steps.biometric-engines-token.outputs.token && format('https://x-access-token:{0}@github.com', steps.biometric-engines-token.outputs.token) || '' }}
