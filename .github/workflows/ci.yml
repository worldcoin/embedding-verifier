name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Configure private Git dependencies
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features --

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Configure private Git dependencies
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Build debug
        run: cargo build --locked --verbose
      - name: Build release
        run: cargo build --locked --release --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Configure private Git dependencies
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run tests
        run: cargo test --locked --all --all-features --verbose

  # The EIF path has no other automatic cover: the cargo jobs above never read flake.nix, the
  # enclave images left build-docker.yml, and verify-measurements.yml only runs on dispatch. So
  # evaluate every enclave output — a bumped input, a renamed package or a flake.lock that no
  # longer matches flake.nix fails on the PR that does it. Evaluation only; measuring the PCRs
  # is still a 90-minute build and still manual.
  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      # crane resolves the private face-engine dependency with `builtins.fetchGit`, which runs
      # on the host and uses the host's git credentials. A credential helper rather than
      # `url.insteadOf`, because the rewrite depends on which git backend Nix was built with.
      - name: Authorize git for biometric-engines
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: an input added to flake.nix without a matching `nix flake update`
      # would otherwise be resolved against upstream right now and the lock quietly rewritten.
      - name: Evaluate the enclave and EIF derivations
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          set -euo pipefail
          for output in di-enclave deepface-enclave di-eif deepface-eif; do
            # Assign, don't interpolate into echo: a substitution inside an argument keeps
            # echo's exit status, and the eval failure would pass `set -e` unnoticed.
            drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
            echo "$output -> $drv"
          done

  deny:
    name: Cargo deny
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        with:
          command: check ${{ matrix.checks }}
          rust-version: 1.97.0
          credentials: https://x-access-token:${{ steps.biometric-engines-token.outputs.token }}@github.com
