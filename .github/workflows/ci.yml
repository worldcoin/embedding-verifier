# Three independent cargo workspaces, each with its own lockfile: the host-side one at the
# repository root, and one per enclave so nothing outside an EIF's own graph can move its PCRs.
# Every job runs across all three. Only deepface/enclave reaches a private repository, so the
# other two lanes run without a token — if the root workspace ever regains `face-engine`, its
# lane fails here rather than in a Docker build.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path ${{ matrix.workspace }}/Cargo.toml --all -- --check

  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run Clippy
        run: cargo clippy --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --all-targets --all-features --

  build:
    name: Build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Build debug
        run: cargo build --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --verbose
      - name: Build release
        run: cargo build --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --release --verbose

  test:
    name: Test (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.workspace }}
      - name: Configure private Git dependencies
        if: matrix.workspace == 'deepface/enclave'
        env:
          BIOMETRIC_ENGINES_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${BIOMETRIC_ENGINES_TOKEN}@github.com/worldcoin/biometric-engines".insteadOf \
            "https://github.com/worldcoin/biometric-engines"
      - name: Run tests
        run: cargo test --manifest-path ${{ matrix.workspace }}/Cargo.toml --locked --all --all-features --verbose

  # The cargo jobs above never read flake.nix, and verify-measurements.yml — the only job that
  # builds an EIF — skips PRs that touch nothing an enclave reaches. So evaluate every enclave
  # output here: a bumped input, a renamed package, a path dependency missing from flake.nix's
  # per-workload source list, or a flake.lock that no longer matches flake.nix fails on the PR
  # that does it. Evaluation only; measuring the PCRs is still a 90-minute build.
  #
  # x86_64-linux, because the EIF outputs evaluate through an import-from-derivation that only
  # a linux builder can realise. Running this on macOS would fail on the platform, not the code.
  flake:
    name: Flake eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      # crane resolves the private face-engine dependency with `builtins.fetchGit`, which runs
      # on the host and uses the host's git credentials. A credential helper rather than
      # `url.insteadOf`, because the rewrite depends on which git backend Nix was built with.
      - name: Authorize git for biometric-engines
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          git config --global credential."https://github.com".helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # --no-update-lock-file: an input added to flake.nix without a matching `nix flake update`
      # would otherwise be resolved against upstream right now and the lock quietly rewritten.
      - name: Evaluate the enclave and EIF derivations
        env:
          GH_APP_TOKEN: ${{ steps.biometric-engines-token.outputs.token }}
        run: |
          set -euo pipefail
          for output in di-enclave deepface-enclave di-eif deepface-eif; do
            # Assign, don't interpolate into echo: a substitution inside an argument keeps
            # echo's exit status, and the eval failure would pass `set -e` unnoticed.
            drv="$(nix eval --raw --no-update-lock-file ".#packages.x86_64-linux.$output.drvPath")"
            echo "$output -> $drv"
          done

      # Evaluation alone would not have caught the enclaves moving into their own workspaces:
      # the derivation built fine and cargo failed inside it. di-enclave is small and public, so
      # actually building it is minutes, and it exercises the parts eval cannot — that cargo
      # resolves the nested workspace from flake.nix's filtered source and that --locked holds.
      # deepface stays eval-only; its build is the 90 minutes verify-measurements.yml spends.
      - name: Build the di enclave
        run: nix build --no-link --no-update-lock-file .#packages.x86_64-linux.di-enclave

  deny:
    name: Cargo deny (${{ matrix.workspace }}, ${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [".", "deepface/enclave", "di/enclave"]
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v4
      - name: Mint biometric-engines access token
        id: biometric-engines-token
        if: matrix.workspace == 'deepface/enclave'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.BIOMETRIC_ENGINES_APP_ID }}
          private-key: ${{ secrets.BIOMETRIC_ENGINES_APP_PRIVATE_KEY }}
          owner: worldcoin
          repositories: biometric-engines
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: ${{ matrix.checks == 'advisories' }}
        with:
          command: check ${{ matrix.checks }}
          # The one deny.toml at the repository root covers all three workspaces; cargo-deny
          # reads it from the working directory, which is where the action runs.
          manifest-path: ${{ matrix.workspace }}/Cargo.toml
          rust-version: 1.97.0
          # Only the deepface enclave lane mints a token; the others resolve nothing private.
          credentials: ${{ steps.biometric-engines-token.outputs.token && format('https://x-access-token:{0}@github.com', steps.biometric-engines-token.outputs.token) || '' }}
