[package]
name = "enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
ciborium.workspace = true
crypto.workspace = true
enclave-types.workspace = true
face-engine.workspace = true
hex.workspace = true
image.workspace = true
getrandom.workspace = true
# rand 0.8's OsRng feeds the match-token signer; getrandom's SysRng feeds the sealed channel.
# Same OS entropy source, two trait families -- see EnclaveState::generate.
rand.workspace = true
pontifex = { workspace = true, features = ["nsm", "server"] }
serde = { workspace = true }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
