[package]
name = "secure-enclave"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "secure-enclave"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Named explicitly for the response half of the channel: RFC 9180 §9.8 derives the
# response key and nonce from the request's HPKE exporter and hands them to a standalone
# AEAD, which `hpke` does not expose a constructor for. Already in the tree via `hpke`'s
# `chacha` feature, so this adds a manifest entry, not a crate.
chacha20poly1305.workspace = true
ciborium.workspace = true
enclave-types.workspace = true
hex.workspace = true
hpke.workspace = true
pontifex = { workspace = true, features = ["nsm", "server"] }
serde = { workspace = true }
serde_bytes.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
