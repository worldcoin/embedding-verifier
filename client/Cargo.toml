[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `attestation` brings in `crypto::nitro`, which this crate re-exports: the attestation
# verifier and its trust anchor live there so relying parties can verify a document without
# taking on an HTTP client.
crypto = { workspace = true, features = ["attestation"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
hex-literal.workspace = true
tokio.workspace = true
