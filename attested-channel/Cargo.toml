[package]
name = "attested-channel"
description = "Verifying an enclave's attestation and opening an HPKE channel to the enclave it attests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Named explicitly for the response half: RFC 9180 §9.8 exports a key and nonce from the request
# context and hands them to a standalone AEAD, which `hpke` exposes no constructor for. Already
# in the tree via `hpke`'s `aes` feature, so this is a manifest entry, not a new crate.
aes-gcm.workspace = true
hkdf.workspace = true
getrandom.workspace = true
hpke.workspace = true
# Deliberately not the workspace `sha2` (0.10, which the image-hashing users are on): this must
# match the generation `hpke` already resolves for HKDF-SHA256, so the enclave links one SHA-256
# rather than two. Verify with `cargo tree -p attested-channel`.
sha2 = "0.11"
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
hex-literal.workspace = true
