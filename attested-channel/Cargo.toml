[package]
name = "attested-channel"
description = "Verifying an enclave's attestation and opening an HPKE channel to the enclave it attests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
attestation = [
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:base64",
    "dep:ciborium",
    "dep:coset",
    "dep:hex",
    "dep:p384",
    "dep:serde",
    "dep:thiserror",
    "dep:webpki",
    "dep:x509-cert",
]

[dependencies]
aes-gcm.workspace = true
hkdf.workspace = true
getrandom.workspace = true
hpke.workspace = true
# Deliberately not the workspace `sha2` (0.10, which the image-hashing users are on): this must
# match the generation `hpke` already resolves for HKDF-SHA256, so the enclave links one SHA-256
# rather than two. Verify with `cargo tree -p attested-channel`.
sha2 = "0.11"
zeroize = { workspace = true, features = ["alloc"] }

aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
hex = { workspace = true, features = ["serde"], optional = true }
p384 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
webpki = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }

[dev-dependencies]
hex-literal.workspace = true
