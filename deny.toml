# One policy for all three workspaces: the root one, deepface/enclave and di/enclave.
# cargo-deny reads `<cwd>/deny.toml`, so run it from the repository root and select the
# workspace with --manifest-path:
#
#   cargo deny --manifest-path deepface/enclave/Cargo.toml --all-features check
#
# Each workspace sees a subset of the dependencies, so `unused-allowed-license` and
# `unused-allowed-source` are set to "allow" below — otherwise every lane warns about the
# allowances the other lanes need. The cost is that a genuinely stale allowance no longer
# gets flagged; an allowance that matches nothing permits nothing, so it is a hygiene
# question rather than a policy hole.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
ignore = [
    # Required by Pontifex's AWS NSM dependencies; no maintained compatible release exists.
    "RUSTSEC-2021-0127",
]

[bans]
multiple-versions = "allow"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
]

[licenses]
version = 2
confidence-threshold = 1.0
# See the note at the top: three workspaces share this allow list, each using part of it.
unused-allowed-license = "allow"
# biometric-engines is a private first-party repository whose crates are not
# published with SPDX metadata. Keep enforcing licenses for every other source.
private = { ignore = true, ignore-sources = ["https://github.com/worldcoin/biometric-engines"] }
allow = [
    "Apache-2.0",
    # Reached via blake3, which taceo-eddsa-babyjubjub uses to expand signing keys.
    # Permissive, OSI-approved, and no more restrictive than BSD-3-Clause below.
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Reached via webpki-roots, the Mozilla CA bundle rustls uses in the verifier client.
    "CDLA-Permissive-2.0",
    # Reached via webpki, which validates the Nitro attestation chain. Matches
    # worldcoin/bedrock, whose verifier this port is derived from.
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    # telemetry-batteries uses this public-domain instrumentation helper for HTTP spans.
    { allow = ["CC0-1.0"], name = "tracing-opentelemetry-instrumentation-sdk", version = "0.38.3" },
    # telemetry-batteries reaches option-ext through dirs; MPL's copyleft is file-scoped.
    { allow = ["MPL-2.0"], name = "option-ext", version = "0.2.0" },
]

# cargo-deny cannot infer webpki's ISC license from its text. Copied from bedrock's deny.toml.
[[licenses.clarify]]
name = "webpki"
version = "0.22.4"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Only deepface/enclave reaches biometric-engines; the other two workspaces resolve no git
# source at all, so this goes unmatched there. See the note at the top.
unused-allowed-source = "allow"
allow-git = ["https://github.com/worldcoin/biometric-engines"]
