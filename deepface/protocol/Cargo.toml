[package]
name = "deepface-protocol"
description = "Sealed request, response, and match-token protocol for the DeepFace embedding verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
homepage = "https://github.com/worldcoin/embedding-verifier"
repository = "https://github.com/worldcoin/embedding-verifier"
publish = true

# In the deepface-enclave graph, so nothing here is inherited from the root workspace.
# See the note in the root Cargo.toml.
[dependencies]
# Challenge images: the RP writes AES-256-GCM blobs to S3, which fixes the algorithm. Same
# version as `attested-channel`'s HPKE suite, so the enclave links one AEAD.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5" }
ark-ff = "0.5"
attested-channel = { version = "0.1.0", path = "../../shared/attested-channel" }
ciborium = "0.2"
coset = "0.4.2"
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.5" }
poseidon2 = { package = "taceo-poseidon2", version = "0.2" }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
rand = "0.8"
