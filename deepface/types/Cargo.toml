[package]
name = "deepface-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# In the deepface-enclave graph, so versions are pinned here rather than inherited from the root
# workspace table. See the note in the root Cargo.toml.
[dependencies]
enclave-types = { path = "../../shared/enclave-types" }
pontifex = { version = "1.1.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
