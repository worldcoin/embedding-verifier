# Its own workspace, with its own Cargo.lock, so nothing the host-side workspace resolves can
# change what goes into this EIF. Every version here is explicit for the same reason: this
# manifest plus the lockfile beside it are the whole input to PCR0.
[workspace]
resolver = "3"

[package]
name = "deepface-enclave"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
publish = false

[[bin]]
name = "deepface-enclave"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5" }
attested-channel = { path = "../../shared/attested-channel" }
ciborium = "0.2"
deepface-enclave-types = { path = "../enclave-types" }
deepface-protocol = { path = "../protocol" }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.5" }
face-engine = { git = "https://github.com/worldcoin/biometric-engines", rev = "face-engine-v2.16.0", default-features = false, features = ["tract"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
pontifex = { version = "1.1.2", default-features = false, features = ["nsm", "server"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time", "test-util"] }
