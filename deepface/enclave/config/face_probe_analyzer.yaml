graph:
  # Match the iOS deepFace purpose used for live and challenge probe images.
  - node_name: rgb_net
    node_type: RGBNet
    dependencies: ["input"]
    args:
      # Packaged at this fixed location in the prototype enclave image.
      model_path: /models/rgbnet.onnx
      confidence_threshold: 0.8
      iou_threshold: 0.3

  - node_name: largest_bounding_box_subject_extractor
    node_type: LargestBoundingBoxSubjectExtractor
    dependencies: ["input", "rgb_net"]
    args:
      correct_inferred_orientation: true
