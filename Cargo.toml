# Host-side workspace: the HTTP hosts, the attestation-verifying client, the e2e harness, and
# the crates the enclaves share with them.
#
# Each enclave is its own workspace with its own lockfile (deepface/enclave, di/enclave), so
# nothing resolved here can move an EIF's PCRs. The crates in both graphs — attested-channel,
# enclave-types, deepface-protocol, deepface-types, di-types — are members here, but inherit
# nothing: not the dependency versions in [workspace.dependencies], and not the package
# metadata in [workspace.package]. Both tables below therefore reach only the four host-side
# crates. Inherited `edition` would change how an enclave compiles, and an inherited `version`
# bump would strand both enclave lockfiles against `--locked`.
[workspace]
members = [
    "deepface/client",
    "deepface/e2e",
    "deepface/host",
    "deepface/protocol",
    "deepface/types",
    "di/host",
    "di/types",
    "shared/attested-channel",
    "shared/enclave-types",
]
exclude = [
    "deepface/enclave",
    "di/enclave",
]
resolver = "3"

# Inherited only by deepface-client, deepface-e2e, deepface-host and di-host. The crates an
# enclave reaches spell their metadata out themselves.
[workspace.package]
edition = "2024"
rust-version = "1.97.0"
version = "0.1.0"
license = "MIT"
publish = false

# Only the host-side-only crates inherit from here: deepface-client, deepface-e2e,
# deepface-host, di-host. Adding a dependency for one of them cannot change an enclave build.
[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
attested-channel = { path = "shared/attested-channel" }
axum = "0.8"
base64 = "0.22"
deepface-client = { path = "deepface/client" }
deepface-protocol = { path = "deepface/protocol" }
deepface-types = { path = "deepface/types" }
di-types = { path = "di/types" }
enclave-types = { path = "shared/enclave-types" }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hex-literal = "1.1"
pontifex = { version = "1.1.2", default-features = false }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
telemetry-batteries = { version = "0.4.0", default-features = false, features = ["metrics-statsd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
