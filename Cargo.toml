[workspace]
members = [
    "verifier/api-types",
    "verifier/client",
    "verifier/e2e",
    "verifier/enclave-types",
    "verifier/enclave",
    "verifier/host",
    "verifier/protocol",
    "di/enclave",
    "di/host",
    "shared/attested-channel",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.2.0"
license = "MIT"
homepage = "https://github.com/worldcoin/flamingo"
repository = "https://github.com/worldcoin/flamingo"
publish = false

[workspace.dependencies]
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0"
ark-babyjubjub = { package = "taceo-ark-babyjubjub", version = "0.5" }
ark-ff = "0.5"
async-trait = "0.1"
attested-channel = { version = "0.2.0", path = "shared/attested-channel" }
axum = "0.8"
base64 = "0.22"
aws-nitro-enclaves-nsm-api = { version = "0.4", default-features = false }
ciborium = "0.2"
coset = "0.4.2"
flamingo-verifier-api-types = { version = "0.2.0", path = "verifier/api-types" }
flamingo-verifier-client = { path = "verifier/client" }
flamingo-verifier-enclave-types = { path = "verifier/enclave-types" }
flamingo-verifier-protocol = { version = "0.2.0", path = "verifier/protocol" }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.5" }
face-engine = { git = "https://github.com/worldcoin/biometric-engines", rev = "face-engine-v2.16.0", default-features = false, features = ["tract"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hex-literal = "1.1"
hkdf = "0.13"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "aes"] }
http-body-util = "0.1"
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384"] }
pontifex = { version = "1.1.2", default-features = false }
poseidon2 = { package = "taceo-poseidon2", version = "0.2" }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
# This specific version is used by the attested-channel
# Look into that project for more details
sha2_0_11 = { package = "sha2", version = "0.11" }
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
telemetry-batteries = { version = "0.4.1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
webpki = "0.22"
x509-cert = "0.2.5"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
