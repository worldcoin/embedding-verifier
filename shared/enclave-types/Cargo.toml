[package]
name = "enclave-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
publish = false

# In both enclave graphs. Nothing here is inherited from the root workspace — not the package
# metadata above, not the versions below — so an edit there cannot reach an EIF.
[dependencies]
pontifex = { version = "1.1.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
