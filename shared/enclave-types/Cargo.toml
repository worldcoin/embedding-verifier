[package]
name = "enclave-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The HPKE sealing contract. Enabled by the enclave and by clients that seal
# payloads for it; the host only relays ciphertext and does not need it.
sealing = ["dep:aes-gcm", "dep:hpke", "dep:zeroize"]

[dependencies]
aes-gcm = { workspace = true, optional = true }
hpke = { workspace = true, optional = true }
pontifex = { workspace = true }
serde = { workspace = true }
serde_bytes.workspace = true
zeroize = { workspace = true, optional = true }
