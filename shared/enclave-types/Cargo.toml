[package]
name = "enclave-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# In both enclave graphs, so versions are pinned here rather than inherited from the root
# workspace table — an edit there must not be able to move an EIF's PCRs.
[dependencies]
pontifex = { version = "1.1.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
