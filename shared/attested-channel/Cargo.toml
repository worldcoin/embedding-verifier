[package]
name = "attested-channel"
description = "Verifying an enclave's attestation and opening an HPKE channel to the enclave it attests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
attestation = [
    "dep:aws-nitro-enclaves-nsm-api",
    "dep:base64",
    "dep:ciborium",
    "dep:coset",
    "dep:hex",
    "dep:p384",
    "dep:serde",
    "dep:thiserror",
    "dep:webpki",
    "dep:x509-cert",
]

[dependencies]
# The HPKE suite's AEAD and the exporter-derived response half. AES-256-GCM because the RP
# already writes AES-256-GCM blobs to S3 for the challenge image, so the enclave links one AEAD
# rather than two. `deepface-protocol` pins the same version for that job.
aes-gcm.workspace = true
# HKDF for the response derivation in RFC 9458 §4.4. Pinned to the 0.13 line because that is what
# `hpke` already resolves for its own HKDF-SHA256, so this adds no crate to the enclave image.
hkdf.workspace = true
getrandom.workspace = true
# rust-hpke: the only Rust HPKE implementation with an independent security review. Default
# features are off so `mlkem` does not drag ml-kem, x-wing and sha3 into the enclave image;
# `x25519` transitively enables `hkdfsha2`, which the DHKEM(X25519, HKDF-SHA256) suite needs.
# `aes` rather than `chacha` so the suite reuses the AEAD the challenge-image path already
# requires. Revisit `mlkem`/`x-wing` if the KEM ever needs to be post-quantum hybrid.
hpke.workspace = true
# Deliberately not 0.10 (which the image-hashing users are on): this must match the generation
# `hpke` already resolves for HKDF-SHA256, so the enclave links one SHA-256 rather than two.
# Verify with `cargo tree -p attested-channel`.
sha2_0_11.workspace = true
zeroize.workspace = true

# Attestation crates are pinned to bedrock's versions so the two verifiers cannot drift.
aws-nitro-enclaves-nsm-api = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
coset = { workspace = true, optional = true }
hex = { workspace = true, features = ["serde"], optional = true }
p384 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
webpki = { workspace = true, optional = true }
x509-cert = { workspace = true, optional = true }

[dev-dependencies]
hex-literal.workspace = true
