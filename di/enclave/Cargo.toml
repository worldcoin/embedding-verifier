# Its own workspace, with its own Cargo.lock, so neither the host-side workspace nor the
# deepface enclave can change what goes into this EIF. Every version here is explicit for the
# same reason: this manifest plus the lockfile beside it are the whole input to PCR0.
[workspace]
resolver = "3"

[package]
name = "di-enclave"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
publish = false

[[bin]]
name = "di-enclave"
path = "src/main.rs"

[dependencies]
di-types = { path = "../types" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
